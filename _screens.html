<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TETH 화면 찾아보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#101113;--card:#17181B;--line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.12);
 --accent:#00FEFF;--t1:#ececec;--t2:#cfd2d6;--t3:#9ea3ad;--chip:#25272C;--chip2:#313339;--chip3:#45484F;
 --ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--t1);font-family:Pretendard,-apple-system,system-ui,sans-serif;font-size:14px;line-height:1.5;display:flex;flex-direction:column}
header{padding:16px 20px 12px;border-bottom:1px solid var(--line);flex:none}
h1{margin:0 0 3px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.sub{margin:0;font-size:12.5px;color:var(--t3)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:11px 20px;border-bottom:1px solid var(--line);flex:none}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--chip);border-radius:999px;border:1px solid var(--line)}
.seg button{height:30px;padding:0 13px;border:0;border-radius:999px;background:transparent;color:var(--t3);font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:background .2s var(--ease),color .2s var(--ease)}
.seg button:hover{color:#fff;background:var(--chip2)}
.seg button[aria-pressed=true]{background:var(--chip3);color:#fff;font-weight:600}
.search{flex:1 1 200px;min-width:170px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--chip);color:var(--t1);font:inherit;font-size:13.5px;outline:none}
.search:focus{border-color:var(--accent)}
.search::placeholder{color:var(--t3)}
.count{font-size:12.5px;color:var(--t3);font-variant-numeric:tabular-nums}
.main{flex:1;display:grid;grid-template-columns:minmax(300px,400px) 1fr;min-height:0}
@media (max-width:900px){.main{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
.list{overflow-y:auto;padding:10px 14px 40px;border-right:1px solid var(--line)}
.ghd{position:sticky;top:0;z-index:2;margin:16px 0 6px;padding:7px 2px;background:var(--bg);font-size:12.5px;font-weight:700;color:var(--t2)}
.ghd:first-child{margin-top:0}
.ghd em{font-style:normal;color:var(--t3);font-weight:500;margin-left:6px}
.shd{margin:10px 0 4px;padding:3px 2px;font-size:11.5px;color:var(--t3);font-weight:600}
.row{display:flex;align-items:center;gap:9px;width:100%;margin-bottom:3px;padding:8px 11px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--t1);font:inherit;text-align:left;cursor:pointer;transition:background .16s var(--ease),border-color .16s var(--ease)}
.row:hover{background:var(--chip2);border-color:var(--line2)}
.row[aria-pressed=true]{border-color:var(--accent);background:var(--chip2)}
.row .nm{flex:1;min-width:0;font-size:13px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .id{flex:none;font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums}
.row.warn .dot{background:#EBCB8B}
.row .fk{font-style:normal;font-size:10.5px;color:var(--t3);border:1px solid var(--line2);border-radius:5px;padding:0 4px;margin-left:5px}
.row .wt{font-style:normal;font-size:10.5px;color:#EBCB8B;border:1px solid rgba(235,203,139,.35);border-radius:5px;padding:0 4px;margin-left:5px}
.row.off{opacity:.45;cursor:not-allowed}
.row.off:hover{background:var(--card);border-color:var(--line)}
.dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--chip3)}
.row.on .dot{background:var(--accent)}
.empty{padding:20px 4px;color:var(--t3);font-size:13px}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;background:#0b0c0e}
.stagebar{display:flex;align-items:baseline;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex:none;font-size:12.5px;color:var(--t3)}
.stagebar b{color:var(--t1);font-size:13.5px;font-weight:600}
.fsb{margin-left:auto;align-self:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:#313339;color:#fff;font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:background .2s ease}
.fsb:hover{background:#3a3d44}
/* 나란히 보기(켜고 끄기): 크게 보기와 같은 단추. 나란히일 때는 수정본/원본 고르기를 숨김 */
#sideBtn+#bigBtn{margin-left:8px}
body.side .cmp{display:none}
body.solo #sideBtn{display:none}
/* 크게 보기(켜고 끄기): 머리·목록·이름 줄을 숨기고 화면만 창 전체에. 오른쪽 위 "작게 보기"나 Esc로 돌아옴 */
.bigx{display:none;position:fixed;top:12px;right:12px;z-index:100;height:32px;padding:0 14px;border:0;border-radius:999px;background:rgba(49,51,57,.92);color:#fff;font:600 12px Pretendard,system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.4);transition:background .2s ease}
.bigx:hover{background:#3a3d44}
body.solo .bigx{display:block}
body.solo{max-width:none;margin:0;padding:0}
body.solo>header,body.solo .bar,body.solo .list,body.solo .stagebar{display:none!important}
body.solo .frames{padding:0!important;position:fixed;inset:0;overflow:hidden}
body.solo .frames iframe{width:100vw!important;height:100vh!important;border:0!important;border-radius:0!important;box-shadow:none!important}
.frames{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;gap:20px;padding:20px}
/* 비포·애프터 비교 (사용자 지시) */
.cmp{display:inline-flex;gap:3px;margin-left:10px;padding:3px;border-radius:999px;background:#25272c;border:1px solid rgba(255,255,255,.06)}
.cmp button{height:26px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:#9ea3ad;font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
.cmp button:hover{color:#fff}
.cmp button[aria-pressed="true"]{background:#45484f;color:#fff}
.fwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.fwrap>span{font-size:12px;font-weight:600;color:#9ea3ad}
.fwrap.now>span{color:#00feff}
body.solo .cmp,body.solo .fwrap>span{display:none}
.noorig{width:380px;padding:20px;border-radius:16px;background:#17181B;border:1px solid rgba(255,255,255,.06);font-size:13px;line-height:1.7;color:#9ea3ad}
.noorig b{display:block;margin-bottom:8px;font-size:14px;color:#ececf1}
.noorig code{display:block;margin-top:8px;padding:10px 12px;border-radius:10px;background:#101113;color:#cfd2d6;font-size:12px;word-break:break-all}
iframe{border:0;border-radius:20px;background:var(--bg);box-shadow:0 18px 48px rgba(0,0,0,.55)}
.hint{margin:auto;color:var(--t3);font-size:13px;text-align:center;line-height:1.8}
kbd{font:inherit;font-size:11.5px;background:var(--chip);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;color:var(--t2)}
</style>

<header>
  <h1>TETH 화면 찾아보기</h1>
  <p class="sub">화면 모아보기 PDF와 같은 묶음·같은 이름입니다. PDF에서 본 화면을 여기서 바로 띄워 고칠 수 있습니다.</p>
</header>

<div class="bar">
  <div class="seg" role="group" aria-label="화면 크기">
    <button type="button" data-w="390" aria-pressed="true">모바일 390</button>
    <button type="button" data-w="1440" aria-pressed="false">PC 1440</button>
  </div>
  <div class="seg" role="group" aria-label="연결 상태">
    <button type="button" data-f="all" aria-pressed="true">전체</button>
    <button type="button" data-f="on" aria-pressed="false">확인된 것만</button>
  </div>
  <input class="search" id="q" type="search" placeholder="화면 이름으로 찾기 (예: 홈, 결제, 백테스트)" autocomplete="off">
  <span class="count" id="count"></span>
</div>

<div class="main">
  <div class="list" id="list"></div>
  <div class="stage">
    <div class="stagebar"><b id="curId">화면을 고르십시오</b><span id="curNm"></span><span class="cmp" id="cmp" role="group" aria-label="원본과 비교"><button type="button" data-v="now" aria-pressed="true" title="내 수정본">수정본</button><button type="button" data-v="orig" aria-pressed="false" title="원본 사이트(aresjoo/tesia-lab main)">원본</button></span><button type="button" class="fsb" id="sideBtn" aria-pressed="false" title="원본과 수정본을 나란히 봅니다. 다시 누르면 하나만">나란히 보기</button><button type="button" class="fsb" id="bigBtn" title="머리·목록을 숨기고 화면을 창 전체로 봅니다. Esc로 돌아옵니다">크게 보기</button></div>
    <div class="frames" id="frames"><p class="hint">왼쪽에서 화면을 고르면 여기에 뜹니다.<br><kbd>/</kbd> 로 검색창, <kbd>Esc</kbd> 로 비우기<br>주소 끝에 <kbd>#09-01</kbd> 처럼 붙이면 그 화면이 바로 열립니다.</p></div>
  </div>
</div>

  "06-08":{w:390,go:function(w){(function(){ var P=w.QA_PAGES, gi=-1, ii=-1; for(var a=0;a<P.length;a++){ if(P[a][0]==="AI 트레이딩"){ gi=a;   for(var b=0;b<P[a][1].length;b++){ if(P[a][1][b][0]==="예약 주문 대기(미체결 주문)"){ ii=b; break; } } break; } } if(gi<0||ii<0){ console.error('QA 시나리오 못 찾음: AI 트레이딩 / 예약 주문 대기(미체결 주문)'); return; } w.qaRun(gi,ii); })();}},

var W=390, FILTER='all', CUR=null, frame=null;
function wired(id){ return !!ENTRY[id]; }
function save(){ try{ localStorage.setItem('teth.screens',JSON.stringify({W:W,F:FILTER})); }catch(e){} }
function load(){ try{ var o=JSON.parse(localStorage.getItem('teth.screens')||'{}'); if(o.W) W=o.W; if(o.F) FILTER=o.F; }catch(e){} }

function render(){
  var q=document.getElementById('q').value.trim().toLowerCase();
  var html='', shown=0, lastG=null, lastH=null;
  GROUPS.forEach(function(g){
    var rows=SCREENS.filter(function(s){
      if(s.g!==g.no) return false;
      if(FILTER==='on' && !VSET[s.id]) return false;
      if(q && (s.id+' '+(s.head||'')+' '+s.name+' '+g.title).toLowerCase().indexOf(q)<0) return false;
      return true;
    });
    if(!rows.length) return;
    var onN=rows.filter(function(s){ return VSET[s.id]; }).length;
    html+='<div class="ghd">'+g.no+' '+g.title+'<em>'+onN+' / '+rows.length+'</em></div>';
    lastH=null;
    rows.forEach(function(s){
      if(s.head&&s.head!==lastH){ lastH=s.head; html+='<div class="shd">'+s.head+'</div>'; }
      var on=wired(s.id), ck=!!VSET[s.id];
      html+='<button type="button" class="row'+(on?(ck?' on':' warn'):' off')+'" data-id="'+s.id+'"'+(on?'':' disabled')+' aria-pressed="'+(CUR===s.id)+'">'
        +'<span class="dot"></span><span class="nm">'+s.name+(on&&!ck?' <i class="wt">확인 전</i>':'')+'</span><span class="id">'+s.id+'</span></button>';
      shown++;
    });
  });
  document.getElementById('list').innerHTML=html||'<p class="empty">찾는 화면이 없습니다.</p>';
  var total=SCREENS.length, onTotal=SCREENS.filter(function(s){ return VSET[s.id]; }).length, warnN=SCREENS.filter(function(s){ return wired(s.id)&&!VSET[s.id]; }).length;
  document.getElementById('count').textContent=shown+'개 보임 · 확인된 것 '+onTotal+' / '+total+(warnN?' · 확인 전 '+warnN:'');
}

/* 보기 방식: now 수정본 / orig 원본 / both 나란히 */
var VIEW='now';
function oneFrame(box,src,label,isNow){
  var wrap=document.createElement('div'); wrap.className='fwrap'+(isNow?' now':'');
  if(label){ var t=document.createElement('span'); t.textContent=label; wrap.appendChild(t); }
  var f=document.createElement('iframe');
  f.style.width=W+'px'; f.style.height=(W===390?844:900)+'px';
  wrap.appendChild(f); box.appendChild(wrap); f.dataset.src=src; return f;
}
function makeFrame(){
  var box=document.getElementById('frames'); box.innerHTML='';
  if(VIEW==='both'){
    var a=oneFrame(box,'_orig.html','원본',false), b=oneFrame(box,'index.html','수정본',true);
    b.id='f'; frame=b; return [a,b];
  }
  var one=oneFrame(box,VIEW==='orig'?'_orig.html':'index.html',VIEW==='orig'?'원본':'',VIEW!=='orig');
  one.id='f'; frame=one; return [one];
}
var ORIG_OK=null;
function origCheck(cb){
  if(ORIG_OK!==null){ cb(ORIG_OK); return; }
  fetch('_orig.html',{method:'HEAD'}).then(function(r){ ORIG_OK=r.ok; cb(ORIG_OK); })
    .catch(function(){ ORIG_OK=false; cb(false); });
}
function origMissing(){
  var box=document.getElementById('frames'); box.innerHTML='';
  var d=document.createElement('div'); d.className='noorig';
  d.innerHTML='<b>원본 사본이 없습니다</b>원본과 비교하려면 tesia-lab 폴더에 사본을 하나 만들어 주십시오. 저장소에는 올라가지 않습니다.'
    +'<code>git show origin-up/main:index.html &gt; _orig.html</code>'
    +'<code>git remote add origin-up https://github.com/aresjoo/tesia-lab.git</code>원본 연결이 없으면 위 한 줄을 먼저 실행합니다.';
  box.appendChild(d);
}
function fresh(run){
  if(VIEW!=='now'&&ORIG_OK===false){ origMissing(); return; }
  var fs=makeFrame();
  fs.forEach(function(f){
    try{ f.contentWindow.localStorage.removeItem('teth.state'); }catch(e){}
    f.onload=function(){ f.onload=null;
      try{ f.contentWindow.localStorage.removeItem('teth.state'); }catch(e){}
      setTimeout(function(){ try{ run(f.contentWindow); }catch(e){ console.error(e); } },600); };
    f.src=f.dataset.src+'?'+Date.now();
  });
}
function openScreen(id){
  if(!wired(id)) return;
  CUR=id;
  var s=null; SCREENS.forEach(function(x){ if(x.id===id) s=x; });
  document.getElementById('curId').textContent=s?s.name:id;
  document.getElementById('curNm').textContent=s&&s.head?s.head:'';
  if(location.hash.slice(1)!==id) history.replaceState(null,'','#'+id);
  var E=ENTRY[id];
  if(E.w&&E.w!==W){ W=E.w; save();
    document.querySelectorAll('.seg [data-w]').forEach(function(x){ x.setAttribute('aria-pressed',+x.dataset.w===W); }); }
  render();
  fresh(function(w){ E.go(w); if(E.then) setTimeout(function(){ try{ E.then(w); }catch(e){ console.error(e); } },E.wait||800); });
}
function openFromHash(){
  var h=decodeURIComponent(location.hash.slice(1)); if(!h) return;
  if(wired(h)){ openScreen(h); return; }
  var s=null; SCREENS.forEach(function(x){ if(x.id===h) s=x; });
  if(s){ document.getElementById('q').value=s.name; render();
    document.getElementById('curId').textContent=s.name;
    document.getElementById('curNm').textContent='아직 열리지 않는 화면입니다'; }
}

document.getElementById('list').addEventListener('click',function(e){
  var b=e.target.closest('.row'); if(!b||b.disabled) return; openScreen(b.dataset.id);
});
document.getElementById('q').addEventListener('input',render);
document.querySelectorAll('.seg [data-w]').forEach(function(b){ b.onclick=function(){
  W=+b.dataset.w;
  document.querySelectorAll('.seg [data-w]').forEach(function(x){ x.setAttribute('aria-pressed',x===b); });
  if(frame){ frame.style.width=W+'px'; frame.style.height=(W===390?844:900)+'px'; } save(); }; });
document.querySelectorAll('.seg [data-f]').forEach(function(b){ b.onclick=function(){
  FILTER=b.dataset.f;
  document.querySelectorAll('.seg [data-f]').forEach(function(x){ x.setAttribute('aria-pressed',x===b); });
  render(); save(); }; });
document.addEventListener('keydown',function(e){
  var q=document.getElementById('q');
  if(e.key==='/'&&document.activeElement!==q){ e.preventDefault(); q.focus(); }
  if(e.key==='Escape'&&document.activeElement===q){ q.value=''; render(); q.blur(); }
});
window.addEventListener('hashchange',openFromHash);

load();
document.querySelectorAll('.seg [data-w]').forEach(function(x){ x.setAttribute('aria-pressed',+x.dataset.w===W); });
document.querySelectorAll('.seg [data-f]').forEach(function(x){ x.setAttribute('aria-pressed',x.dataset.f===FILTER); });
(function(){ var x=document.createElement('button'); x.type='button'; x.className='bigx'; x.textContent='작게 보기'; document.body.appendChild(x);
  var set=function(on){ var L=document.getElementById('list');
    if(on&&L){ try{ sessionStorage.setItem('teth.screens.y',String(L.scrollTop)); }catch(e){} } /* 숨기기 전에 보던 자리 적어 두기 */
    document.body.classList.toggle('solo',on);
    if(!on&&L){ try{ var y=+sessionStorage.getItem('teth.screens.y'); if(y) L.scrollTop=y; }catch(e){} } /* 돌아오면 그 자리로 (사용자 지시) */
    try{ sessionStorage.setItem('teth.screens.big',on?'1':''); }catch(e){} };
  x.onclick=function(){ set(false); };
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&document.body.classList.contains('solo')) set(false); });
  window._bigSet=set;
  try{ if(sessionStorage.getItem('teth.screens.big')) document.body.classList.add('solo'); }catch(e){}
})();
render();
openFromHash();
document.getElementById('bigBtn').onclick=function(){ window._bigSet(true); };
/* 비포·애프터: 고르면 보던 화면을 그 쪽으로 다시 띄운다 (사용자 지시) */
document.getElementById('cmp').addEventListener('click',function(e){
  var b=e.target.closest('button[data-v]'); if(!b) return;
  VIEW=b.dataset.v;
  if(VIEW!=='now') origCheck(function(ok){ if(!ok&&CUR) origMissing(); });
  [].forEach.call(this.querySelectorAll('button[data-v]'),function(x){ x.setAttribute('aria-pressed',x===b); });
  try{ sessionStorage.setItem('teth.screens.view',VIEW); }catch(e2){}
  if(CUR) openScreen(CUR);
});
var LASTV='now';
function sideSync(){ var on=VIEW==='both', s=document.getElementById('sideBtn'); s.textContent=on?'하나만 보기':'나란히 보기'; s.setAttribute('aria-pressed',on); document.body.classList.toggle('side',on);
  if(!on) [].forEach.call(document.querySelectorAll('#cmp button[data-v]'),function(x){ x.setAttribute('aria-pressed',x.dataset.v===VIEW); }); }
document.getElementById('sideBtn').onclick=function(){
  if(VIEW==='both'){ VIEW=LASTV||'now'; } else { LASTV=VIEW; VIEW='both'; origCheck(function(ok){ if(!ok&&CUR) origMissing(); }); }
  try{ sessionStorage.setItem('teth.screens.view',VIEW); sessionStorage.setItem('teth.screens.lastv',LASTV); }catch(e2){}
  sideSync(); if(CUR) openScreen(CUR); };
try{ var v0=sessionStorage.getItem('teth.screens.view');
  if(v0&&v0!=='now'){ VIEW=v0;
    [].forEach.call(document.querySelectorAll('#cmp button[data-v]'),function(x){ x.setAttribute('aria-pressed',x.dataset.v===v0); }); }
  LASTV=sessionStorage.getItem('teth.screens.lastv')||'now'; }catch(e){}
try{ sideSync(); }catch(e){}
/* 왼쪽 목록 스크롤 위치 기억: 새로고침·반영하기 뒤에도 보던 자리 그대로 */
(function(){
  var L=document.getElementById('list'); if(!L) return;
  try{ var y=+sessionStorage.getItem('teth.screens.y'); if(y&&!document.body.classList.contains('solo')) L.scrollTop=y; }catch(e){}
  var save=function(){ if(document.body.classList.contains('solo')) return; /* 숨은 동안의 0 을 적지 않는다 (사용자 지시) */
    try{ sessionStorage.setItem('teth.screens.y',String(L.scrollTop)); }catch(e){} };
  L.addEventListener('scroll',function(){ clearTimeout(L._t); L._t=setTimeout(save,150); });
  window.addEventListener('pagehide',save);
})();
/* 바뀐 내용 알림: index.html·_screens.html 이 바뀌면 아래에 "반영하기" 버튼을 띄운다. 누르면 새 주소로 다시 열어 확실히 새로 받음(저절로 깜빡이지 않음).
   미리보기 서버(serve.ps1)의 /__ver 가 없으면 조용히 멈춘다 */
(function(){
  var last=null, off=false, el=null;
  function show(){
    if(el) return;
    var st=document.createElement('style');
    st.textContent='.upd{position:fixed;left:50%;bottom:24px;transform:translate(-50%,8px);opacity:0;z-index:99;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 18px;border-radius:999px;background:#26282d;border:1px solid rgba(255,255,255,.06);box-shadow:0 8px 30px rgba(0,0,0,.45);font:14px Pretendard,system-ui,sans-serif;color:#fff;transition:opacity .3s ease,transform .3s cubic-bezier(.2,.8,.3,1)}.upd.on{opacity:1;transform:translate(-50%,0)}.upd button{height:36px;padding:0 16px;border:0;border-radius:999px;background:#00feff;color:#101113;font:600 13px Pretendard,system-ui,sans-serif;cursor:pointer;transition:background .2s ease}.upd button:hover{background:#5cfeff}';
    document.head.appendChild(st);
    el=document.createElement('div'); el.className='upd'; el.innerHTML='바뀐 내용이 있습니다<button type="button">반영하기</button>';
    el.querySelector('button').onclick=function(){ location.replace(location.pathname+'?v='+Date.now()+location.hash); };
    document.body.appendChild(el); requestAnimationFrame(function(){ el.classList.add('on'); });
  }
  function tick(){
    if(off||document.hidden) return;
    fetch('__ver?'+Date.now(),{cache:'no-store'}).then(function(r){ if(!r.ok){ off=true; return null; } return r.text(); }).then(function(v){
      if(v==null) return;
      if(last!==null&&v!==last){ show(); }
      last=v;
    }).catch(function(){});
  }
  setInterval(tick,1500); tick();
})();
</script>
